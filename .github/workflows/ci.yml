name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install install-electron
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - run: node scripts/desktop-smoke.cjs
      - run: node scripts/release-safety-smoke.cjs
      - run: node scripts/reminder-smoke.cjs
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
